name: CI/CD Tienda Perritos - Frontend

on:
  push:
    branches: [ "main" ]

jobs:
  build-push-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Configurar credenciales AWS (para SSM)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build imagen Frontend y push a Docker Hub
      run: |
        docker build -t ignsf/perritos_frontend:latest .
        docker push ignsf/perritos_frontend:latest

    - name: Desplegar Frontend vía SSM
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_FRONTEND_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --comment "Actualizar perritos-frontend desde Docker Hub" \
          --parameters '{"commands":[
            "docker pull ignsf/perritos_frontend:latest",
            "docker stop perritos-frontend || true",
            "docker rm perritos-frontend || true",
            "docker run -d --name perritos-frontend -p 80:80 --restart unless-stopped ignsf/perritos_frontend:latest"
          ]}' \
          --output text
